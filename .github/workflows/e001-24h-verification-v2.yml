# Runs one prospectively dated, explicitly approved, read-only integrity smoke.
# The authorization marker is NOT the original E001 24h smoke marker.
# ALL raw/metadata evidence is archived to a draft GitHub Release: this workflow
# does NOT use GitHub Actions artifact storage, cache, orders, or paid runners.
name: E001 V2 read-only 24h integrity verification

on:
  push:
    branches: [main]
    paths:
      - research/E001_VERIFICATION_V2_AUTHORIZATION.json
  schedule:
    # One target day only: Oct 14 at 17:37 EDT. Year-free cron would repeat
    # next October, but the 2026-dated authorization safely skips by then.
    - cron: "37 21 14 10 *"

permissions:
  contents: write

concurrency:
  group: e001-v2-read-only-verification
  cancel-in-progress: false

jobs:
  launch-window:
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.eligible.outputs.armed }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip safely unless distinct authorization exists and future window is open
        id: eligible
        run: |
          echo "armed=false" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, pathlib, datetime, os
          path = pathlib.Path("research/E001_VERIFICATION_V2_AUTHORIZATION.json")
          if not path.is_file():
              print("No V2 authorization marker. Safe skip.")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          now = datetime.datetime.now(datetime.UTC)
          try:
              start = datetime.datetime.fromisoformat(data["earliest_launch_utc"].replace("Z","+00:00"))
              end = datetime.datetime.fromisoformat(data["latest_launch_utc"].replace("Z","+00:00"))
          except (KeyError, ValueError, TypeError):
              print("Invalid authorization dates; full gate will reject if armed.")
              raise SystemExit(0)
          if start.tzinfo is not None and end.tzinfo is not None and start <= now <= end:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print("armed=true", file=output)
          else:
              print("Not in narrow owner-approved launch interval; safe skip.")
          PY

  chunk1:
    needs: launch-window
    if: needs.launch-window.outputs.armed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Strict V2 scope, pinned SHA, evening time and Release-only storage gate
        run: |
          set -euo pipefail
          AUTH=research/E001_VERIFICATION_V2_AUTHORIZATION.json
          test -s "$AUTH"
          python -m kalshi_mm.smoke_v2_gate --authorization "$AUTH"
          BASE_SHA="$(python -c 'import json; print(json.load(open("research/E001_VERIFICATION_V2_AUTHORIZATION.json"))["collector_commit_sha"])')"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")" = "$AUTH" || {
            echo "::error::Frozen code changed after V2 approval; stop"
            exit 1
          }
          test "$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | wc -l)" -eq 1
      - name: Verify live unauthenticated public GET contracts
        run: python -m kalshi_mm.smoke_preflight
      - name: Create unique draft evidence release (without paid Actions artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh init
      - name: Preserve V2 authorization within the first immutable checkpoint
        run: |
          mkdir -p smoke-data
          cp research/E001_VERIFICATION_V2_AUTHORIZATION.json smoke-data/verification-authorization.json
      - name: Public GET-only observer chunk 1
        run: python -m kalshi_mm.smoke_runner --root smoke-data --chunk 1 --max-minutes 330
      - name: SHA-verify, split and upload raw segment and restart to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh upload smoke-data 1

  chunk2:
    needs: chunk1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Restore and verify previous immutable checkpoint from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh restore smoke-data 1
      - name: Public GET-only observer chunk 2
        run: python -m kalshi_mm.smoke_runner --root smoke-data --chunk 2 --max-minutes 330
      - name: SHA-verify, split and upload raw segment and restart to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh upload smoke-data 2

  chunk3:
    needs: chunk2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Restore and verify previous immutable checkpoint from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh restore smoke-data 2
      - name: Public GET-only observer chunk 3
        run: python -m kalshi_mm.smoke_runner --root smoke-data --chunk 3 --max-minutes 330
      - name: SHA-verify, split and upload raw segment and restart to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh upload smoke-data 3

  chunk4:
    needs: chunk3
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Restore and verify previous immutable checkpoint from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh restore smoke-data 3
      - name: Public GET-only observer chunk 4
        run: python -m kalshi_mm.smoke_runner --root smoke-data --chunk 4 --max-minutes 330
      - name: SHA-verify, split and upload raw segment and restart to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh upload smoke-data 4

  chunk5:
    needs: chunk4
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Restore and verify previous immutable checkpoint from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh restore smoke-data 4
      - name: Public GET-only observer chunk 5
        run: python -m kalshi_mm.smoke_runner --root smoke-data --chunk 5 --max-minutes 330
      - name: SHA-verify, split and upload raw segment and restart to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh upload smoke-data 5

  integrity-review:
    needs: chunk5
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Download and verify final checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh restore smoke-final 5
      - name: Download all release raw parts and validate SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh download-all smoke-final
      - name: Fail-closed integrity replay; economic performance remains blinded
        run: |
          test -s smoke-final/verification-authorization.json
          python -m kalshi_mm.smoke_review --root smoke-final
      - name: Upload integrity-only review to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e001_v2_release_raw.sh upload-review smoke-final
